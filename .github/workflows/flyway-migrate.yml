# ---------------------------------------------------------------------------
# Migración de schema con Flyway vía GitHub Actions — Cobertura Vehicular
#
# Adaptado de flyway-migrate.yml (data_ops_course_101, Sesión 2 — CI/CD con Flyway)
# al modelo propio del equipo 5.
#
# Qué hace: cada push a `main` que toque las migraciones aplica los cambios
# pendientes sobre la branch `main` de Neon. Nadie se conecta a la base a mano.
#
# Secreto requerido (Settings → Secrets and variables → Actions):
#   NEON_MAIN_DATABASE_URL   postgresql://usuario:password@host/neondb?sslmode=require
#
# Se guarda la URI tal como la entrega el Neon Console. El workflow la traduce
# a los tres parámetros que Flyway espera. Ver el paso "Traducir la URI de Neon".
# ---------------------------------------------------------------------------

name: Flyway Migrate

# ¿Por qué solo `push` a main y no también `pull_request`? Porque este workflow
# escribe en la base de producción. Un pull request puede venir de un fork, y en
# ese escenario GitHub no expone los secretos — el job fallaría de forma confusa.
on:
  push:
    branches: [main]
    paths:
      - 'momento1/sql_migrations/**'
      - '.github/workflows/flyway-migrate.yml'
  workflow_dispatch:

# ¿Por qué `cancel-in-progress: false`? Es el valor que evita corrupción. Si dos
# pushes seguidos dispararan dos migraciones simultáneas contra la misma base, la
# segunda podría encontrar el schema a medio migrar. Este bloque las serializa.
# Y cancelar una migración a mitad de camino es peor que esperarla: dejaría la
# base en un estado que nadie registró.
concurrency:
  group: flyway-produccion
  cancel-in-progress: false

env:
  FLYWAY_IMAGE: flyway/flyway:13.1.0-alpine
  MIGRATIONS_DIR: momento1/sql_migrations

jobs:
  migrate:
    name: Aplicar migraciones a Neon (main)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      # -----------------------------------------------------------------------
      # ¿Por qué hay que traducir la URI? Neon entrega un connection string en
      # formato URI de PostgreSQL, con el usuario y la contraseña dentro de la
      # propia cadena. Flyway corre sobre la JVM y usa JDBC, que espera un formato
      # distinto y las credenciales por separado.
      #
      #   Neon : postgresql://usuario:clave@host/neondb?sslmode=require
      #   JDBC : jdbc:postgresql://host/neondb?sslmode=require  + user + password
      #
      # Guardamos un solo secreto con la URI completa en lugar de tres separados
      # porque es lo que el Console te da: menos pasos manuales, menos formas de
      # equivocarse al copiar.
      # -----------------------------------------------------------------------
      - name: Traducir la URI de Neon a parámetros JDBC
        id: conexion
        env:
          NEON_URI: ${{ secrets.NEON_MAIN_DATABASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${NEON_URI:-}" ]; then
            echo "::error::El secreto NEON_MAIN_DATABASE_URL no está configurado."
            echo "Configúralo en Settings → Secrets and variables → Actions."
            exit 1
          fi

          sin_protocolo="${NEON_URI#*://}"
          credenciales="${sin_protocolo%%@*}"
          servidor="${sin_protocolo#*@}"

          usuario="${credenciales%%:*}"
          clave="${credenciales#*:}"

          host_y_db="${servidor%%\?*}"
          host="${host_y_db%%/*}"
          base="${host_y_db#*/}"

          # ¿Por qué descartamos los parámetros originales de la URI y forzamos
          # solo sslmode=require? Porque Neon añade `channel_binding=require`, que
          # el driver JDBC de PostgreSQL no reconoce y rechaza al conectar. Los
          # parámetros de conexión NO son portables entre drivers: cada uno acepta
          # su propio conjunto.
          jdbc="jdbc:postgresql://${host}/${base}?sslmode=require"

          # ::add-mask:: es obligatorio aquí. GitHub oculta automáticamente el valor
          # completo de un secreto en los logs, pero no sus fragmentos: la
          # contraseña que acabamos de extraer es una subcadena y saldría en claro
          # si algún comando la imprimiera. Esta línea la registra como sensible.
          echo "::add-mask::${clave}"

          echo "jdbc=${jdbc}"       >> "$GITHUB_OUTPUT"
          echo "usuario=${usuario}" >> "$GITHUB_OUTPUT"
          echo "clave=${clave}"     >> "$GITHUB_OUTPUT"

          echo "Destino: ${host}/${base}"

      # -----------------------------------------------------------------------
      # ¿Por qué la imagen de Docker y no instalar el CLI? Porque la imagen trae
      # Flyway, su JRE y los drivers JDBC ya resueltos y fijados a una versión.
      # Correr exactamente la misma imagen en local y en CI elimina la clase
      # entera de bugs del tipo "en mi máquina sí funciona".
      # -----------------------------------------------------------------------
      - name: Descargar la imagen de Flyway
        run: docker pull "${FLYWAY_IMAGE}"

      - name: Flyway info (estado previo)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/${MIGRATIONS_DIR}:/flyway/sql:ro" \
            "${FLYWAY_IMAGE}" \
            -url="${{ steps.conexion.outputs.jdbc }}" \
            -user="${{ steps.conexion.outputs.usuario }}" \
            -password="${{ steps.conexion.outputs.clave }}" \
            -locations="filesystem:/flyway/sql" \
            info

      # -----------------------------------------------------------------------
      # `validate` es la puerta de calidad, y va ANTES de migrate a propósito:
      # detecta que alguien editó una migración ya aplicada (checksum mismatch) y
      # detiene el pipeline sin tocar la base. Sin este paso, el error aparecería
      # a mitad de la migración, con parte de los cambios ya escritos.
      # -----------------------------------------------------------------------
      - name: Flyway validate
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/${MIGRATIONS_DIR}:/flyway/sql:ro" \
            "${FLYWAY_IMAGE}" \
            -url="${{ steps.conexion.outputs.jdbc }}" \
            -user="${{ steps.conexion.outputs.usuario }}" \
            -password="${{ steps.conexion.outputs.clave }}" \
            -locations="filesystem:/flyway/sql" \
            -validateMigrationNaming=true \
            -ignoreMigrationPatterns='*:pending' \
            validate

      - name: Flyway migrate
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/${MIGRATIONS_DIR}:/flyway/sql:ro" \
            "${FLYWAY_IMAGE}" \
            -url="${{ steps.conexion.outputs.jdbc }}" \
            -user="${{ steps.conexion.outputs.usuario }}" \
            -password="${{ steps.conexion.outputs.clave }}" \
            -locations="filesystem:/flyway/sql" \
            -baselineOnMigrate=true \
            -baselineVersion=1 \
            -baselineDescription="Cobertura vehicular estado base" \
            -outOfOrder=false \
            -cleanDisabled=true \
            migrate

      # ¿Qué hacen esos tres flags de baseline? Resuelven el problema del primer
      # run: la branch `main` de Neon ya tiene las tablas de la carga inicial
      # (inyeccion_semilla_equipo_5.py), pero no tiene flyway_schema_history. Sin
      # baselineOnMigrate, Flyway vería una base con objetos que él no creó y
      # abortaría. Con ellos, en la primera ejecución registra el estado actual
      # como versión 1 y aplica lo que venga después.
      # `cleanDisabled=true` bloquea `flyway clean`, que borraría el schema
      # completo: en un pipeline que apunta a producción, no queremos ni que
      # exista la posibilidad.

      - name: Flyway info (estado final)
        if: always()
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/${MIGRATIONS_DIR}:/flyway/sql:ro" \
            "${FLYWAY_IMAGE}" \
            -url="${{ steps.conexion.outputs.jdbc }}" \
            -user="${{ steps.conexion.outputs.usuario }}" \
            -password="${{ steps.conexion.outputs.clave }}" \
            -locations="filesystem:/flyway/sql" \
            info

      - name: Resumen del run
        if: always()
        run: |
          {
            echo "## Flyway — resultado"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Destino | Neon · branch \`main\` |"
            echo "| Imagen | \`${FLYWAY_IMAGE}\` |"
            echo "| Migraciones | \`${MIGRATIONS_DIR}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Estado | \`${{ job.status }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
